name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FastMediatR.slnx

      - name: Format check
        run: dotnet format FastMediatR.slnx --verify-no-changes --severity error

      - name: Build
        run: dotnet build FastMediatR.slnx --configuration Release --no-restore /warnaserror

      - name: Test
        run: dotnet test FastMediatR.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**/*'

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        # No --no-build: the FastMediatR metapackage's bundling targets resolve project
        # references, which under NoBuild invokes Build on them and fails NETSDK1085.
        # Pack is incremental right after the Build step above, so this costs ~nothing.
        run: dotnet pack FastMediatR.slnx --configuration Release --output ./artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
